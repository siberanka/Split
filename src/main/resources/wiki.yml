# ==============================================================================
# Split ${project.version} — Complete Tutorial and Configuration Reference
# ==============================================================================
#
# This file is generated and maintained automatically by Split.
#
# IMPORTANT: It is documentation only. Nothing in this file is read as a setting,
# and changing it cannot alter plugin behavior. Every line is a YAML comment.
#
# Split compares this file with the copy bundled in the plugin on every server
# start and /split reload. If it is missing, edited, or outdated after a plugin
# update, the bundled current copy replaces it. Put actual settings only in
# config.yml, messages.yml, and placeholders.yml.
#
# ==============================================================================
# ENGLISH GUIDE
# ==============================================================================
#
# ## 1. What Split Does
#
# Split registers PlaceholderAPI placeholders in the following form:
#
# ```text
# %split_<key>%
# ```
#
# `<key>` is a top-level key from `placeholders.yml`. For example, the configuration key `server_label` is requested as `%split_server_label%`.
#
# Split supports four placeholder types:
#
# 1. `simple` — selects a Java or Bedrock value.
# 2. `switch` — maps a resolved source value to a configured case.
# 3. `expression` — evaluates a safe boolean or relational formula.
# 4. `adaptive` — measures resolved text and produces a calculated number, repeated output, or formatted template.
#
# Placeholder keys and type names are case-insensitive. Returned text from `simple`, `switch`, and `expression` may contain other PlaceholderAPI placeholders. Split resolves those nested placeholders before returning the final value. Adaptive sources are refreshed after their configured cooldown, but adaptive results are deliberately returned literally for safety.
#
# ## 2. Requirements and Installation
#
# - Java 21.
# - A Spigot/Paper-compatible server or Folia. The build targets Spigot API 1.20.4.
# - PlaceholderAPI is required to register and use `%split_*%` placeholders. Split builds against 2.12.2; Folia requires a Folia-capable PlaceholderAPI release (2.11.7 or newer).
# - Floodgate is optional. Without Floodgate, online players resolve as Java players in `simple` placeholders.
#
# Installation:
#
# 1. Stop the server.
# 2. Put `Split-${project.version}.jar` in the server `plugins` directory.
# 3. Install PlaceholderAPI and, when Bedrock detection is needed, Floodgate.
# 4. Start the server.
# 5. Edit the real configuration files under `plugins/Split/`.
# 6. Run `/split reload` or restart the server.
#
# ### Platform and Folia behavior
#
# - The same JAR supports Spigot/Paper and Folia; no separate Folia build is required.
# - `plugin.yml` declares `folia-supported: true`, allowing Folia to load Split.
# - Folia is detected with Paper's official `RegionizedServer` marker.
# - On Folia, configuration/wiki disk work uses the async scheduler.
# - Player replies use that player's entity scheduler, which follows the entity between regions.
# - Console and other non-entity replies use the global-region scheduler.
# - On Bukkit/Paper, Split uses the equivalent classic Bukkit scheduler paths.
# - Shutdown rejects new scheduled work and cancels owned async/global tasks. A retired player response is safely discarded.
# - PlaceholderAPI requires a synchronous result. Split therefore evaluates placeholders in the caller's valid context and never blocks one Folia region waiting for another.
#
# ## 3. Files and Their Authority
#
# ### `config.yml`
#
# Functional global settings. Split reads this file.
#
# ### `messages.yml`
#
# Functional command messages. Split reads this file.
#
# ### `placeholders.yml`
#
# Functional placeholder definitions. Split reads this file.
#
# ### `wiki.yml`
#
# Non-functional documentation. Split never parses it as configuration. It is an automatically synchronized mirror of the guide inside the JAR. Manual changes are intentionally overwritten on the next start or `/split reload`.
#
# ## 4. Commands and Permissions
#
# ### `/split reload`
#
# Reloads `config.yml`, `messages.yml`, and `placeholders.yml`, and synchronizes `wiki.yml`.
#
# - Permission: `split.admin`
# - Console use: supported.
# - Disk parsing runs asynchronously.
# - On Folia, player responses use the owning entity scheduler and console responses use the global-region scheduler. Bukkit/Paper uses its server scheduler.
# - Only one reload may run at once.
# - A malformed configuration does not replace the active configuration. The last valid in-memory configuration continues running.
#
# ## 5. `config.yml` — Every Setting
#
# ```yaml
# debug: false
# default-to-java-on-null: true
# ```
#
# ### `debug`
#
# - Type: boolean (`true` or `false`)
# - Default: `false`
# - Enables detailed diagnostics for circular placeholder references, resolution failures, Floodgate lookup failures, and successful reload activity.
# - Keep it disabled during normal production operation unless troubleshooting.
#
# ### `default-to-java-on-null`
#
# - Type: boolean
# - Default: `true`
# - Applies to `simple` placeholders when the requested player is null or offline and platform detection is therefore not reliable.
# - `true`: return the configured `java` value.
# - `false`: return an empty string.
# - Online players still use Floodgate detection when Floodgate is available.
#
# ## 6. `messages.yml` — Every Setting
#
# Messages support legacy color codes such as `&a` and hex colors such as `&#55ff99`.
#
# ```yaml
# prefix: "&8[&bSplit&8] &r"
# no-permission: "%prefix%&cYou do not have permission to execute this command!"
# only-players: "%prefix%&cThis command can only be executed by players!"
# reload-success: "%prefix%&aConfiguration files reloaded successfully."
# reload-failure: "%prefix%&cAn error occurred while reloading the configuration files!"
# reload-in-progress: "%prefix%&eA configuration reload is already in progress."
# invalid-usage: "%prefix%&cInvalid usage! &fUsage: /split reload"
# ```
#
# - `prefix`: reusable message prefix. `%prefix%` in other messages is replaced while messages are loaded.
# - `no-permission`: shown when the sender lacks `split.admin`.
# - `only-players`: reserved compatibility message. The current reload command supports both players and console, so this message is not emitted by the current command flow.
# - `reload-success`: shown after all functional configuration files load successfully.
# - `reload-failure`: shown when YAML syntax or validation fails. The previous valid configuration remains active.
# - `reload-in-progress`: shown when another reload is already running.
# - `invalid-usage`: shown for missing or unsupported command arguments.
#
# ## 7. `placeholders.yml` Basics
#
# Each top-level YAML section creates one `%split_<key>%` placeholder:
#
# ```yaml
# welcome_text:
#   type: "simple"
#   java: "Welcome, Java player"
#   bedrock: "Welcome, Bedrock player"
# ```
#
# Usage:
#
# ```text
# %split_welcome_text%
# ```
#
# Canonical type names are `simple`, `switch`, `expression`, and `adaptive`. Adaptive also accepts `adaptive-space`, `adaptive_spacing`, and `adaptive-spacing` as compatibility aliases. Unknown explicit types are rejected so a typo cannot silently activate the wrong behavior.
#
# When `type` is omitted, Split infers it in this order:
#
# 1. A `switch` key selects `switch`.
# 2. A `formule` key selects `expression`.
# 3. A `source` key or `calculation` section selects `adaptive`.
# 4. Otherwise, `simple` is selected.
#
# ## 8. `simple` Placeholder
#
# Chooses a value based on player platform.
#
# ```yaml
# platform_name:
#   type: "simple"
#   java: "Java Edition"
#   bedrock: "Bedrock Edition"
# ```
#
# Settings:
#
# - `type`: `simple`.
# - `java`: returned for a verified Java player and, depending on `default-to-java-on-null`, unresolved players.
# - `bedrock`: returned when Floodgate verifies the online player as Bedrock.
#
# Both output values may contain nested PlaceholderAPI placeholders:
#
# ```yaml
# platform_greeting:
#   type: "simple"
#   java: "Hello %player_name% from Java"
#   bedrock: "Hello %player_name% from Bedrock"
# ```
#
# ## 9. `switch` Placeholder
#
# Resolves the `switch` text, performs a case-insensitive lookup in `case`, and falls back to `default`.
#
# ```yaml
# rank_label:
#   type: "switch"
#   switch: "%luckperms_highest_group_by_weight%"
#   case:
#     owner: "Server Owner"
#     admin: "Administrator"
#     moderator: "Moderator"
#     default: "Player"
# ```
#
# Settings:
#
# - `type`: `switch`.
# - `switch`: source text to resolve. It can include plain text and one or more PlaceholderAPI placeholders.
# - `case.<value>`: output for a matching resolved value. Matching is case-insensitive.
# - `case.default`: fallback when no case matches or when the switch source is empty.
#
# Case results may contain nested placeholders, which are resolved before returning.
#
# ## 10. `expression` Placeholder
#
# Resolves `formule`, evaluates it without a scripting engine, and returns either `true` or `false` output.
#
# ```yaml
# ping_state:
#   type: "expression"
#   formule: "%player_ping% >= 60 && %player_ping% < 120"
#   true: "Medium ping"
#   false: "Outside the configured range"
# ```
#
# Settings:
#
# - `type`: `expression`.
# - `formule`: formula text. The spelling `formule` is the canonical configuration key for backward compatibility.
# - `true`: output when the formula evaluates to true.
# - `false`: output when the formula is false or cannot be evaluated safely.
#
# Supported operators:
#
# - Comparison: `>`, `<`, `>=`, `<=`, `==`, `=`, `!=`, `<>`.
# - Alternate comparisons: `>>` means `>`, and `<<` means `<`.
# - Logic: `&&`, `||`, `AND`, `OR`, `and`, `or`.
# - Raw truth values: `true`, `yes`, and `1`.
# - Logical precedence: AND is evaluated before OR.
# - Numeric values are compared numerically. Non-numeric values fall back to string comparison.
# - Single or double quotes around comparison operands are removed.
#
# The evaluator is deterministic and does not use JavaScript, Nashorn, shell commands, or dynamic code execution.
#
# ## 11. `adaptive` Placeholder — Complete Tutorial
#
# Adaptive placeholders solve layout and measurement tasks. `source` can be one string or an ordered YAML list. Each entry may contain `%player_name%`, `%placeholder1%%placeholder2%`, or plain text such as `Name: `. Split resolves every entry, joins them, counts the resulting Unicode characters, and converts that length into a bounded result.
#
# ### Processing order
#
# 1. Check the per-player/per-adaptive-key cache on every call.
# 2. During cooldown, return the last calculated output unchanged and without a status message.
# 3. After cooldown, resolve every configured `source` entry once with PlaceholderAPI.
# 4. Join resolved entries with `source-options.separator` and limit the source length.
# 5. Optionally remove color codes and trim leading/trailing whitespace.
# 6. Count or ignore whitespace, then count Unicode code points. An emoji counts as one character.
# 7. Apply the direct, reverse, or map formula; round and clamp to minimum/maximum.
# 8. Render the value as repeated text, a number, or a template.
# 9. Cache and return the literal result without a second PlaceholderAPI parse.
#
# ### Formulas
#
# ```text
# direct  = base + (sourceLength × ratio)
# reverse = base - (sourceLength × ratio)
# map     = minimum + ((sourceLength - source-minimum) / (source-maximum - source-minimum)) × (maximum - minimum)
# final   = rounded result clamped to [minimum, maximum]
# ```
#
# ### Complete canonical configuration
#
# ```yaml
# adaptive_spacing:
#   type: "adaptive"
#   source:
#     - "%vault_eco_balance_formatted%"
#     - "%superior_island_level_format%"
#   calculation:
#     mode: "reverse"
#     ratio: 1.0
#     base: 32
#     source-minimum: 0
#     source-maximum: 8192
#     minimum: 2
#     maximum: 32
#     rounding: "nearest"
#   source-options:
#     separator: ""
#     cooldown-milliseconds: 250
#     max-cache-entries: 1024
#     trim: false
#     strip-color-codes: true
#     count-whitespace: true
#     max-characters: 8192
#   result:
#     type: "repeat"
#     value: " "
#     template: "{source}: {length} characters, {count} units"
#     max-length: 8192
# ```
#
# ### Calculation settings
#
# #### `calculation.mode`
#
# - `direct`: the result grows as source length grows.
# - `reverse`: the result shrinks as source length grows.
# - `map`: linearly maps `source-minimum..source-maximum` to `minimum..maximum`.
# - `inverse` remains a compatibility alias for `reverse`. Other accepted aliases include `increase`, `increasing`, `decrease`, `decreasing`, `duz`, `düz`, `ters`, `mapping`, `scale`, and `normalize`.
# - Default: `direct`.
#
# #### `calculation.ratio`
#
# - Non-negative finite decimal.
# - Amount added or subtracted per counted source character in direct/reverse mode.
# - Ignored in map mode.
# - Default: `1.0`.
#
# #### `calculation.base`
#
# - Finite decimal starting point before the length adjustment in direct/reverse mode.
# - Default in direct mode: `minimum`.
# - Default in reverse mode: `maximum`.
# - Ignored in map mode.
#
# #### `calculation.minimum`
#
# - Inclusive minimum calculated value.
# - May be negative; hard lower safety limit: `-4096`.
# - Default: `0`.
#
# #### `calculation.maximum`
#
# - Inclusive maximum calculated value.
# - Must be at least `minimum` and no greater than the hard safety limit `4096`.
# - Default: `64`.
#
# #### `calculation.source-minimum`
#
# - Lower measured-character boundary used only by map mode.
# - Source lengths at or below it produce `calculation.minimum`.
# - Must be zero or greater and less than `source-maximum`.
# - Default: `0`.
#
# #### `calculation.source-maximum`
#
# - Upper measured-character boundary used only by map mode.
# - Source lengths at or above it produce `calculation.maximum`.
# - Must be greater than `source-minimum` and no greater than `source-options.max-characters`.
# - Default: `source-options.max-characters`.
#
# #### `calculation.rounding`
#
# - `floor`: round down.
# - `ceiling` or `ceil`: round up.
# - `nearest` or `round`: round to the nearest whole number.
# - Default: `nearest`.
#
# ### Source settings
#
# #### `source`
#
# - Required; accepts one string or an ordered YAML list containing `1..32` strings.
# - Each item may include plain characters, punctuation, whitespace, one PlaceholderAPI placeholder, or multiple placeholders.
# - Each item is resolved separately on refresh. Item order is preserved.
# - Each configured item is limited to 4096 Unicode code points; their combined configured limit is 8192.
#
# #### `source-options.separator`
#
# - Literal text inserted between resolved list entries and included in source measurement.
# - Default: empty text (`""`). Maximum: 128 Unicode code points.
#
# #### `source-options.cooldown-milliseconds`
#
# - Per-player/per-adaptive-key source refresh interval.
# - Every request checks freshness. The first request after expiry resolves every source and recalculates the result.
# - Requests during cooldown receive the cached output unchanged; no cooldown/status string is ever returned.
# - Concurrent refreshes for the same player and key are combined into one calculation.
# - Allowed range: `100..60000`. Default: `250` milliseconds.
#
# #### `source-options.max-cache-entries`
#
# - Maximum cached player UUID entries for this adaptive placeholder.
# - Entries are removed when a player quits; the cache is also discarded on configuration reload.
# - Allowed range: `1..4096`. Default: `1024`.
# - If a refresh fails, the last successful output—or empty output before the first success—is cached until the next retry interval.
#
# #### `source-options.trim`
#
# - `true`: remove leading and trailing Unicode whitespace before counting.
# - `false`: keep it.
# - Default: `false`.
#
# #### `source-options.strip-color-codes`
#
# - Removes legacy `&a`/`§a`, `&#RRGGBB`/`§#RRGGBB`, and expanded `&x&F&F...`/`§x§F§F...` sequences before counting.
# - Default: `true`.
#
# #### `source-options.count-whitespace`
#
# - `true`: spaces and other Unicode whitespace contribute to length.
# - `false`: whitespace is ignored.
# - Default: `true`.
#
# #### `source-options.max-characters`
#
# - Maximum resolved source code points inspected or embedded in `{source}`.
# - Allowed range: `1..32768`.
# - Default: `8192`.
#
# ### Result settings
#
# #### `result.type`
#
# - `repeat`: repeat `result.value` the calculated number of times.
# - `number`: return only the calculated integer.
# - `template`: render `result.template`.
# - Negative values are preserved by number and template (`{count}`). Repeat returns empty output for zero or negative counts.
# - Aliases: `character`, `symbol`, and `space` mean repeat; `count` and `numeric` mean number; `format` and `text` mean template.
# - Default: `repeat`.
#
# #### `result.value`
#
# - Literal value used by repeat mode and available as `{value}` in template mode.
# - It may be a normal space, Unicode spacing character, symbol, emoji, percent sign, formatting sequence, or multi-character text.
# - Maximum configured length: 128 Unicode code points.
# - Default: one normal space (`" "`).
#
# #### `result.template`
#
# - Used only by template mode.
# - Available fields:
#   - `{count}` — final calculated integer.
#   - `{length}` — measured source length after source options.
#   - `{source}` — resolved and length-limited source text.
#   - `{value}` — configured `result.value`.
# - Unknown fields remain literal.
# - Maximum configured template length: 4096 Unicode code points.
# - Default: `{count}`.
#
# #### `result.max-length`
#
# - Hard limit for the final repeated or template output.
# - Allowed range: `1..16384` Unicode code points.
# - Default: `8192`.
# - In repeat mode, Split emits only complete `result.value` units that fit inside the limit.
#
# ### Flat compatibility keys
#
# Nested keys are recommended, but the following flat aliases are also accepted:
#
# | Recommended key | Flat aliases |
# | --- | --- |
# | `calculation.mode` | `mode` |
# | `calculation.ratio` | `ratio` |
# | `calculation.base` | `base-spaces`, `base` |
# | `calculation.minimum` | `minimum`, `min-spaces`, `min` |
# | `calculation.maximum` | `maximum`, `max-spaces`, `max` |
# | `calculation.source-minimum` | `source-minimum`, `input-minimum` |
# | `calculation.source-maximum` | `source-maximum`, `input-maximum` |
# | `calculation.rounding` | `rounding` |
# | `source-options.separator` | `source-separator`, `separator` |
# | `source-options.cooldown-milliseconds` | `cooldown-milliseconds`, `cooldown-ms`, `cooldown` |
# | `source-options.max-cache-entries` | `max-cache-entries`, `cache-size` |
# | `source-options.trim` | `trim-source` |
# | `source-options.strip-color-codes` | `strip-color-codes`, `ignore-color-codes` |
# | `source-options.count-whitespace` | `count-whitespace` |
# | `source-options.max-characters` | `max-source-characters` |
# | `result.type` | `output-mode` |
# | `result.value` | `value`, `output-value`, `space-character` |
# | `result.template` | `template`, `output-template` |
# | `result.max-length` | `max-output-length` |
#
# When both canonical and flat keys are present, the canonical nested key wins.
# Normal text does not require Unicode escaping. For example, top-level
# `value: "-"` repeats hyphens and `value: "ABC"` repeats the complete ABC unit.
# The recommended nested spelling remains `result.value`.
#
# ### Output examples
#
# Return a count:
#
# ```yaml
# name_count:
#   type: "adaptive"
#   source: "%player_name%"
#   calculation: { mode: "direct", ratio: 1, base: 0, minimum: 0, maximum: 64 }
#   result: { type: "number" }
# ```
#
# Return the required number of spaces:
#
# ```yaml
# name_padding:
#   type: "adaptive"
#   source: "%player_name%"
#   calculation: { mode: "reverse", ratio: 1, base: 20, minimum: 1, maximum: 20 }
#   result: { type: "repeat", value: " " }
# ```
#
# Repeat a symbol or emoji:
#
# ```yaml
# name_dots:
#   type: "adaptive"
#   source: "%player_name%"
#   calculation: { mode: "direct", ratio: 0.5, base: 0, minimum: 0, maximum: 32, rounding: "ceiling" }
#   result: { type: "repeat", value: "•" }
# ```
#
# Create custom text:
#
# ```yaml
# name_report:
#   type: "adaptive"
#   source: "%player_name%"
#   calculation: { mode: "reverse", ratio: 1, base: 24, minimum: 0, maximum: 24 }
#   result:
#     type: "template"
#     value: "•"
#     template: "Player={source}, characters={length}, calculated={count}, symbol={value}"
# ```
#
# Map a measured source range to a negative/positive result range:
#
# ```yaml
# mapped_name_score:
#   type: "adaptive"
#   source: "%player_name%"
#   calculation:
#     mode: "map"
#     source-minimum: 0
#     source-maximum: 20
#     minimum: -100
#     maximum: 100
#     rounding: "nearest"
#   result: { type: "number" }
# ```
#
# ### Why adaptive results are literal
#
# Each adaptive source entry is parsed once per refresh. Its rendered result is not passed through PlaceholderAPI again. This means a repeated value such as `%`, `%player_name%`, or another percent-containing symbol remains literal. It prevents accidental recursive expansion and workload multiplication. Use `{source}` in template mode when the already-resolved, joined source should appear in the output.
#
# ## 12. Nested Placeholders and Safety Behavior
#
# - Circular `%split_*%` references are detected per thread.
# - A repeated key returns a visible loop marker instead of recursing forever.
# - Resolution depth is limited to 32 different Split keys.
# - Split placeholder parameters longer than 128 UTF-16 units are rejected.
# - Runtime resolution errors fail closed to an empty value; detailed stack traces are logged only when debug mode is enabled.
# - Configuration reload uses an atomic in-memory swap. Requests see either the complete previous configuration or the complete new configuration.
# - Folia-specific classes are isolated behind a runtime bridge, preserving one-JAR Spigot/Paper compatibility.
# - No classic Bukkit scheduler call is made on Folia; entity, global-region, and async ownership rules are respected.
# - Adaptive limits bound source entries, cache size, counting, and generated output.
#
# ## 13. Troubleshooting
#
# ### `%split_key%` appears unchanged
#
# - Confirm PlaceholderAPI is installed and enabled.
# - Confirm the key exists at the top level of `placeholders.yml`.
# - Run `/papi list` and verify the Split expansion is registered.
# - Run `/split reload` and inspect the console for YAML or validation errors.
#
# ### Every player receives the Java value
#
# - Confirm Floodgate is installed and enabled.
# - Confirm the queried player is online.
# - Split intentionally treats unverifiable players according to `default-to-java-on-null`.
#
# ### Adaptive count looks too large
#
# - Enable `source-options.strip-color-codes`.
# - Decide whether punctuation and spaces should count.
# - Set `source-options.count-whitespace: false` when whitespace must be ignored.
# - Use template mode temporarily with `template: "source={source}, length={length}, count={count}"` to inspect the calculation.
#
# ### Reload fails
#
# - YAML indentation must use spaces, not tabs.
# - Quote values containing YAML-special punctuation when uncertain.
# - Verify adaptive ranges and limits.
# - Check the console exception. The old valid configuration remains active.
#
# ### Changes to `wiki.yml` disappear
#
# This is expected. `wiki.yml` is generated documentation and not a user configuration file. Make functional changes in the three YAML files. Maintain personal notes in a differently named file.
#
