# ==============================================================================
# TÜRKÇE REHBER
# ==============================================================================
#
# ## 1. Split Ne Yapar?
#
# Split, PlaceholderAPI üzerinde şu biçimde placeholder'lar kaydeder:
#
# ```text
# %split_<anahtar>%
# ```
#
# `<anahtar>`, `placeholders.yml` dosyasındaki üst seviye bir bölümdür. Örneğin `sunucu_etiketi` anahtarı `%split_sunucu_etiketi%` olarak kullanılır.
#
# Split dört placeholder tipini destekler:
#
# 1. `simple` — Java veya Bedrock değerini seçer.
# 2. `switch` — çözümlenen kaynak değerini tanımlı bir durumla eşleştirir.
# 3. `expression` — güvenli bir mantıksal/karşılaştırmalı formül hesaplar.
# 4. `adaptive` — çözümlenmiş metni ölçerek sayı, tekrarlanan çıktı veya özel şablon üretir.
#
# Placeholder anahtarları ve tip adları büyük/küçük harfe duyarsızdır. `simple`, `switch` ve `expression` sonuçları başka PlaceholderAPI placeholder'ları içerebilir; Split bunları nihai sonuçtan önce çözümler. Adaptive kaynaklar ayarlanan cooldown dolunca yenilenir, adaptive sonuç ise güvenlik nedeniyle literal döndürülür.
#
# ## 2. Gereksinimler ve Kurulum
#
# - Java 21.
# - Spigot/Paper uyumlu sunucu veya Folia. Build hedefi Spigot API 1.20.4'tür.
# - `%split_*%` placeholder'larını kaydetmek ve kullanmak için PlaceholderAPI gereklidir. Split 2.12.2 ile build edilir; Folia, Folia destekli PlaceholderAPI sürümü (2.11.7 veya üzeri) gerektirir.
# - Floodgate isteğe bağlıdır. Floodgate yoksa çevrimiçi oyuncular `simple` placeholder'larda Java oyuncusu sayılır.
#
# Kurulum:
#
# 1. Sunucuyu durdurun.
# 2. `Split-${project.version}.jar` dosyasını sunucunun `plugins` klasörüne koyun.
# 3. PlaceholderAPI'yi, Bedrock tespiti gerekiyorsa Floodgate'i kurun.
# 4. Sunucuyu başlatın.
# 5. Gerçek ayar dosyalarını `plugins/Split/` altında düzenleyin.
# 6. `/split reload` çalıştırın veya sunucuyu yeniden başlatın.
#
# ### Platform ve Folia davranışı
#
# - Aynı JAR Spigot/Paper ve Folia'yı destekler; ayrı bir Folia build'i gerekmez.
# - `plugin.yml`, Folia'nın Split'i yükleyebilmesi için `folia-supported: true` bildirir.
# - Folia, Paper'ın resmi `RegionizedServer` işaretçisiyle tespit edilir.
# - Folia üzerinde yapılandırma/wiki disk işleri async scheduler ile çalışır.
# - Oyuncu cevapları bölgeler arasında entity'yi takip eden oyuncu entity scheduler'ını kullanır.
# - Konsol ve entity olmayan diğer cevaplar global-region scheduler'ı kullanır.
# - Bukkit/Paper üzerinde Split eşdeğer klasik Bukkit scheduler yollarını kullanır.
# - Kapanış yeni görevleri reddeder ve sahip olunan async/global görevleri iptal eder. Retired oyuncu cevabı güvenle bırakılır.
# - PlaceholderAPI senkron sonuç ister. Split bu yüzden placeholder'ları çağıranın geçerli bağlamında hesaplar ve bir Folia bölgesini başka bölgeyi bekleyerek bloklamaz.
#
# ## 3. Dosyalar ve Geçerlilikleri
#
# ### `config.yml`
#
# İşlevsel genel ayarlardır. Split bu dosyayı okur.
#
# ### `messages.yml`
#
# İşlevsel komut mesajlarıdır. Split bu dosyayı okur.
#
# ### `placeholders.yml`
#
# İşlevsel placeholder tanımlarıdır. Split bu dosyayı okur.
#
# ### `wiki.yml`
#
# İşlevsiz dokümantasyon dosyasıdır. Split bunu hiçbir zaman ayar olarak ayrıştırmaz. JAR içindeki rehberin otomatik eşitlenen kopyasıdır. Elle yapılan değişiklikler sonraki açılışta veya `/split reload` sırasında bilerek güncel paket kopyasıyla değiştirilir.
#
# ## 4. Komutlar ve Yetkiler
#
# ### `/split reload`
#
# `config.yml`, `messages.yml` ve `placeholders.yml` dosyalarını yeniden yükler; ayrıca `wiki.yml` dosyasını eşitler.
#
# - Yetki: `split.admin`
# - Konsoldan kullanım: desteklenir.
# - Disk okuma ve ayrıştırma asenkron çalışır.
# - Folia'da oyuncu cevabı owning entity scheduler, konsol cevabı global-region scheduler kullanır. Bukkit/Paper kendi sunucu scheduler'ını kullanır.
# - Aynı anda yalnızca bir reload çalışabilir.
# - Hatalı yapılandırma aktif ayarların yerini almaz. Bellekteki son geçerli yapılandırma çalışmaya devam eder.
#
# ## 5. `config.yml` — Tüm Ayarlar
#
# ```yaml
# debug: false
# default-to-java-on-null: true
# ```
#
# ### `debug`
#
# - Tip: boolean (`true` veya `false`)
# - Varsayılan: `false`
# - Döngüsel placeholder referansları, çözümleme hataları, Floodgate sorgu hataları ve başarılı reload işlemleri için ayrıntılı teşhis çıktısını açar.
# - Sorun giderme dışında production kullanımında kapalı tutulması önerilir.
#
# ### `default-to-java-on-null`
#
# - Tip: boolean
# - Varsayılan: `true`
# - İstenen oyuncu null veya çevrimdışıysa ve platform güvenilir biçimde tespit edilemiyorsa `simple` placeholder'lara uygulanır.
# - `true`: yapılandırılmış `java` değerini döndürür.
# - `false`: boş metin döndürür.
# - Çevrimiçi oyuncularda Floodgate mevcutsa normal platform tespiti devam eder.
#
# ## 6. `messages.yml` — Tüm Ayarlar
#
# Mesajlar `&a` gibi legacy renkleri ve `&#55ff99` gibi hex renkleri destekler.
#
# ```yaml
# prefix: "&8[&bSplit&8] &r"
# no-permission: "%prefix%&cBu komutu kullanmak için yetkiniz yok!"
# only-players: "%prefix%&cBu komut sadece oyuncular tarafından kullanılabilir!"
# reload-success: "%prefix%&aYapılandırma dosyaları başarıyla yenilendi."
# reload-failure: "%prefix%&cYapılandırma dosyaları yenilenirken bir hata oluştu!"
# reload-in-progress: "%prefix%&eBir yapılandırma yenilemesi zaten devam ediyor."
# invalid-usage: "%prefix%&cGeçersiz kullanım! &fKullanım: /split reload"
# ```
#
# - `prefix`: ortak mesaj öneki. Diğer mesajlardaki `%prefix%`, yükleme sırasında bu değerle değiştirilir.
# - `no-permission`: gönderen `split.admin` yetkisine sahip değilse gösterilir.
# - `only-players`: geriye dönük uyumluluk için ayrılmış mesajdır. Mevcut reload komutu hem oyuncuyu hem konsolu kabul ettiği için güncel akışta kullanılmaz.
# - `reload-success`: tüm işlevsel yapılandırma dosyaları başarıyla yüklenince gösterilir.
# - `reload-failure`: YAML veya doğrulama hatasında gösterilir. Önceki geçerli ayar çalışmayı sürdürür.
# - `reload-in-progress`: başka bir reload zaten çalışıyorsa gösterilir.
# - `invalid-usage`: eksik veya desteklenmeyen komut argümanlarında gösterilir.
#
# ## 7. `placeholders.yml` Temelleri
#
# Her üst seviye YAML bölümü bir `%split_<anahtar>%` placeholder'ı oluşturur:
#
# ```yaml
# karsilama_metni:
#   type: "simple"
#   java: "Hoş geldin Java oyuncusu"
#   bedrock: "Hoş geldin Bedrock oyuncusu"
# ```
#
# Kullanımı:
#
# ```text
# %split_karsilama_metni%
# ```
#
# Standart tip adları `simple`, `switch`, `expression` ve `adaptive` şeklindedir. Adaptive, uyumluluk için `adaptive-space`, `adaptive_spacing` ve `adaptive-spacing` adlarını da kabul eder. Açıkça yazılan bilinmeyen tipler reddedilir; böylece yazım hatası sessizce yanlış davranışı etkinleştirmez.
#
# `type` yazılmazsa Split şu sırayla tip çıkarımı yapar:
#
# 1. `switch` anahtarı varsa `switch`.
# 2. `formule` anahtarı varsa `expression`.
# 3. `source` anahtarı veya `calculation` bölümü varsa `adaptive`.
# 4. Hiçbiri yoksa `simple`.
#
# ## 8. `simple` Placeholder
#
# Oyuncu platformuna göre değer seçer.
#
# ```yaml
# platform_adi:
#   type: "simple"
#   java: "Java Edition"
#   bedrock: "Bedrock Edition"
# ```
#
# Ayarlar:
#
# - `type`: `simple`.
# - `java`: doğrulanmış Java oyuncusu ve `default-to-java-on-null` ayarına göre çözümlenemeyen oyuncular için döner.
# - `bedrock`: Floodgate çevrimiçi oyuncuyu Bedrock olarak doğrularsa döner.
#
# İki sonuç da iç içe PlaceholderAPI placeholder'ı barındırabilir:
#
# ```yaml
# platform_selamlama:
#   type: "simple"
#   java: "Merhaba %player_name%, Java kullanıyorsun"
#   bedrock: "Merhaba %player_name%, Bedrock kullanıyorsun"
# ```
#
# ## 9. `switch` Placeholder
#
# `switch` metnini çözümler, `case` içinde büyük/küçük harfe duyarsız eşleşme arar ve eşleşme yoksa `default` kullanır.
#
# ```yaml
# rutbe_etiketi:
#   type: "switch"
#   switch: "%luckperms_highest_group_by_weight%"
#   case:
#     owner: "Sunucu Sahibi"
#     admin: "Yönetici"
#     moderator: "Moderatör"
#     default: "Oyuncu"
# ```
#
# Ayarlar:
#
# - `type`: `switch`.
# - `switch`: çözümlenecek kaynak. Normal metin ve bir veya daha fazla PlaceholderAPI placeholder'ı içerebilir.
# - `case.<değer>`: çözülmüş değer eşleşirse dönecek sonuç. Eşleşme büyük/küçük harfe duyarsızdır.
# - `case.default`: eşleşme bulunmazsa veya kaynak boşsa kullanılacak sonuç.
#
# Case sonuçlarındaki iç içe placeholder'lar nihai dönüşten önce çözümlenir.
#
# ## 10. `expression` Placeholder
#
# `formule` değerini çözümler, script motoru kullanmadan değerlendirir ve `true` ya da `false` sonucunu döndürür.
#
# ```yaml
# ping_durumu:
#   type: "expression"
#   formule: "%player_ping% >= 60 && %player_ping% < 120"
#   true: "Orta ping"
#   false: "Tanımlanan aralığın dışında"
# ```
#
# Ayarlar:
#
# - `type`: `expression`.
# - `formule`: formül metni. `formule` yazımı geriye dönük uyumluluk nedeniyle standart config anahtarıdır.
# - `true`: formül doğruysa dönecek değer.
# - `false`: formül yanlışsa veya güvenli biçimde hesaplanamazsa dönecek değer.
#
# Desteklenen işlemler:
#
# - Karşılaştırma: `>`, `<`, `>=`, `<=`, `==`, `=`, `!=`, `<>`.
# - Alternatif karşılaştırma: `>>`, `>`; `<<`, `<` anlamına gelir.
# - Mantık: `&&`, `||`, `AND`, `OR`, `and`, `or`.
# - Ham doğru değerleri: `true`, `yes`, `1`.
# - İşlem önceliği: AND, OR'dan önce hesaplanır.
# - Sayılar numerik karşılaştırılır. Numerik olmayan değerlerde metin karşılaştırmasına geçilir.
# - Karşılaştırma değerlerinin çevresindeki tek veya çift tırnak kaldırılır.
#
# Değerlendirici deterministiktir; JavaScript, Nashorn, shell komutu veya dinamik kod çalıştırma kullanmaz.
#
# ## 11. `adaptive` Placeholder — Tam Eğitim
#
# Adaptive placeholder'lar yerleşim ve ölçüm işleri içindir. `source` tek metin veya sıralı YAML listesi olabilir. Her öğede `%player_name%`, `%placeholder1%%placeholder2%` ya da `Ad: ` gibi düz metin bulunabilir. Split bütün öğeleri çözümler, birleştirir, oluşan Unicode karakterlerini sayar ve uzunluğu sınırlanmış bir sonuca dönüştürür.
#
# ### İşlem sırası
#
# 1. Her çağrıda oyuncu/adaptive-anahtar cache'inin tazeliğini kontrol et.
# 2. Cooldown içindeyse son hesaplanan çıktıyı değiştirmeden ve durum mesajı eklemeden döndür.
# 3. Cooldown dolduysa yapılandırılmış her `source` öğesini PlaceholderAPI ile bir kez çözümle.
# 4. Çözümlenen öğeleri `source-options.separator` ile birleştir ve kaynak uzunluğunu sınırla.
# 5. İstenirse renk kodlarını kaldır ve baştaki/sondaki boşlukları temizle.
# 6. Boşlukları say veya yok say, ardından Unicode code point say. Bir emoji tek karakterdir.
# 7. Direct, reverse veya map formülünü uygula; yuvarla ve minimum/maximum aralığına sınırla.
# 8. Değeri tekrar, sayı veya şablon biçiminde üret.
# 9. Literal sonucu cache'e al ve ikinci PlaceholderAPI ayrıştırması yapmadan döndür.
#
# ### Formüller
#
# ```text
# direct  = base + (kaynakUzunluğu × ratio)
# reverse = base - (kaynakUzunluğu × ratio)
# map     = minimum + ((kaynakUzunluğu - source-minimum) / (source-maximum - source-minimum)) × (maximum - minimum)
# sonuç   = yuvarlanmış değer, [minimum, maximum] aralığına sınırlandırılır
# ```
#
# ### Eksiksiz standart yapılandırma
#
# ```yaml
# adaptive_bosluk:
#   type: "adaptive"
#   source:
#     - "%vault_eco_balance_formatted%"
#     - "%superior_island_level_format%"
#   calculation:
#     mode: "reverse"
#     ratio: 1.0
#     base: 32
#     source-minimum: 0
#     source-maximum: 8192
#     minimum: 2
#     maximum: 32
#     rounding: "nearest"
#   source-options:
#     separator: ""
#     cooldown-milliseconds: 250
#     max-cache-entries: 1024
#     trim: false
#     strip-color-codes: true
#     count-whitespace: true
#     max-characters: 8192
#   result:
#     type: "repeat"
#     value: " "
#     template: "{source}: {length} karakter, {count} birim"
#     max-length: 8192
# ```
#
# ### Hesaplama ayarları
#
# #### `calculation.mode`
#
# - `direct`: kaynak uzadıkça sonuç büyür.
# - `reverse`: kaynak uzadıkça sonuç küçülür.
# - `map`: `source-minimum..source-maximum` aralığını `minimum..maximum` aralığına doğrusal eşler.
# - `inverse`, `reverse` için geriye uyumlu alias olarak kalır. `increase`, `increasing`, `decrease`, `decreasing`, `duz`, `düz`, `ters`, `mapping`, `scale` ve `normalize` alias'ları da kabul edilir.
# - Varsayılan: `direct`.
#
# #### `calculation.ratio`
#
# - Negatif olmayan sonlu ondalık sayı.
# - Direct/reverse modunda sayılan her kaynak karakteri için eklenecek veya çıkarılacak miktar.
# - Map modunda yok sayılır.
# - Varsayılan: `1.0`.
#
# #### `calculation.base`
#
# - Direct/reverse modunda uzunluk değişimi öncesindeki sonlu ondalık başlangıç değeri.
# - Direct modundaki varsayılanı: `minimum`.
# - Reverse modundaki varsayılanı: `maximum`.
# - Map modunda yok sayılır.
#
# #### `calculation.minimum`
#
# - Hesaplanan değerin dahilî alt sınırı.
# - Negatif olabilir; sert alt güvenlik sınırı `-4096` değeridir.
# - Varsayılan: `0`.
#
# #### `calculation.maximum`
#
# - Hesaplanan değerin dahilî üst sınırı.
# - `minimum` değerinden küçük ve sert güvenlik sınırı `4096` değerinden büyük olamaz.
# - Varsayılan: `64`.
#
# #### `calculation.source-minimum`
#
# - Yalnızca map modunun kullandığı alt ölçülmüş-karakter sınırıdır.
# - Bu değerdeki veya altındaki kaynak uzunluğu `calculation.minimum` üretir.
# - Sıfır veya daha büyük ve `source-maximum` değerinden küçük olmalıdır.
# - Varsayılan: `0`.
#
# #### `calculation.source-maximum`
#
# - Yalnızca map modunun kullandığı üst ölçülmüş-karakter sınırıdır.
# - Bu değerdeki veya üstündeki kaynak uzunluğu `calculation.maximum` üretir.
# - `source-minimum` değerinden büyük, `source-options.max-characters` değerinden küçük veya ona eşit olmalıdır.
# - Varsayılan: `source-options.max-characters`.
#
# #### `calculation.rounding`
#
# - `floor`: aşağı yuvarlar.
# - `ceiling` veya `ceil`: yukarı yuvarlar.
# - `nearest` veya `round`: en yakın tam sayıya yuvarlar.
# - Varsayılan: `nearest`.
#
# ### Kaynak ayarları
#
# #### `source`
#
# - Zorunludur; tek metin veya `1..32` metin içeren sıralı YAML listesi kabul eder.
# - Her öğe normal karakter, noktalama, boşluk, tek PlaceholderAPI placeholder'ı veya birden fazla placeholder içerebilir.
# - Yenilemede her öğe ayrı ayrı çözümlenir; liste sırası korunur.
# - Her yapılandırılmış öğenin sınırı 4096 Unicode code point, tüm öğelerin toplam sınırı 8192'dir.
#
# #### `source-options.separator`
#
# - Çözümlenmiş liste öğelerinin arasına eklenen ve kaynak ölçümüne dahil edilen literal metindir.
# - Varsayılan: boş metin (`""`). Üst sınır: 128 Unicode code point.
#
# #### `source-options.cooldown-milliseconds`
#
# - Oyuncu ve adaptive anahtar başına kaynak yenileme aralığıdır.
# - Her çağrıda tazelik kontrol edilir; süre dolduktan sonraki ilk çağrı bütün kaynakları yeniden çözümler ve sonucu hesaplar.
# - Cooldown içindeki çağrılar cache çıktısını aynen alır; hiçbir cooldown/durum metni döndürülmez.
# - Aynı oyuncu ve anahtar için eşzamanlı yenilemeler tek hesapta birleştirilir.
# - İzin verilen aralık: `100..60000`. Varsayılan: `250` milisaniye.
#
# #### `source-options.max-cache-entries`
#
# - Bu adaptive placeholder için tutulacak oyuncu UUID girdilerinin üst sınırıdır.
# - Oyuncu çıkınca girdisi silinir; yapılandırma reload'unda cache'in tamamı da bırakılır.
# - İzin verilen aralık: `1..4096`. Varsayılan: `1024`.
# - Yenileme hata verirse son başarılı çıktı—ilk başarıdan önce boş çıktı—sonraki deneme aralığına kadar cache'e alınır.
#
# #### `source-options.trim`
#
# - `true`: sayımdan önce baştaki ve sondaki Unicode boşluklarını kaldırır.
# - `false`: boşlukları korur.
# - Varsayılan: `false`.
#
# #### `source-options.strip-color-codes`
#
# - Sayımdan önce legacy `&a`/`§a`, `&#RRGGBB`/`§#RRGGBB` ve genişletilmiş `&x&F&F...`/`§x§F§F...` dizilerini kaldırır.
# - Varsayılan: `true`.
#
# #### `source-options.count-whitespace`
#
# - `true`: boşluklar ve diğer Unicode whitespace karakterleri uzunluğa eklenir.
# - `false`: boşluk karakterleri yok sayılır.
# - Varsayılan: `true`.
#
# #### `source-options.max-characters`
#
# - İncelenecek veya `{source}` içine yerleştirilecek çözümlenmiş kaynak code point üst sınırı.
# - İzin verilen aralık: `1..32768`.
# - Varsayılan: `8192`.
#
# ### Sonuç ayarları
#
# #### `result.type`
#
# - `repeat`: `result.value` değerini hesaplanan sayı kadar tekrarlar.
# - `number`: yalnızca hesaplanan tam sayıyı döndürür.
# - `template`: `result.template` şablonunu üretir.
# - Negatif değerler number ve template (`{count}`) tarafından korunur. Repeat sıfır veya negatif adette boş çıktı döndürür.
# - Alias'lar: `character`, `symbol`, `space` repeat; `count`, `numeric` number; `format`, `text` template anlamına gelir.
# - Varsayılan: `repeat`.
#
# #### `result.value`
#
# - Repeat modunda tekrarlanan ve template modunda `{value}` olarak kullanılabilen literal değerdir.
# - Normal boşluk, Unicode boşluk karakteri, sembol, emoji, yüzde işareti, biçimlendirme dizisi veya çok karakterli metin olabilir.
# - Yapılandırılmış üst sınır: 128 Unicode code point.
# - Varsayılan: bir normal boşluk (`" "`).
#
# #### `result.template`
#
# - Yalnızca template modunda kullanılır.
# - Kullanılabilir alanlar:
#   - `{count}` — nihai hesaplanan tam sayı.
#   - `{length}` — kaynak seçenekleri uygulandıktan sonraki ölçülen uzunluk.
#   - `{source}` — çözümlenmiş ve uzunluğu sınırlandırılmış kaynak.
#   - `{value}` — yapılandırılmış `result.value`.
# - Bilinmeyen alanlar literal kalır.
# - Yapılandırılmış şablon üst sınırı: 4096 Unicode code point.
# - Varsayılan: `{count}`.
#
# #### `result.max-length`
#
# - Nihai tekrarlanan veya şablon çıktısının sert sınırıdır.
# - İzin verilen aralık: `1..16384` Unicode code point.
# - Varsayılan: `8192`.
# - Repeat modunda yalnızca sınıra tamamen sığan `result.value` birimleri üretilir.
#
# ### Düz uyumluluk anahtarları
#
# İç içe anahtarların kullanılması önerilir ancak şu düz alias'lar da kabul edilir:
#
# | Önerilen anahtar | Düz alias'lar |
# | --- | --- |
# | `calculation.mode` | `mode` |
# | `calculation.ratio` | `ratio` |
# | `calculation.base` | `base-spaces`, `base` |
# | `calculation.minimum` | `minimum`, `min-spaces`, `min` |
# | `calculation.maximum` | `maximum`, `max-spaces`, `max` |
# | `calculation.source-minimum` | `source-minimum`, `input-minimum` |
# | `calculation.source-maximum` | `source-maximum`, `input-maximum` |
# | `calculation.rounding` | `rounding` |
# | `source-options.separator` | `source-separator`, `separator` |
# | `source-options.cooldown-milliseconds` | `cooldown-milliseconds`, `cooldown-ms`, `cooldown` |
# | `source-options.max-cache-entries` | `max-cache-entries`, `cache-size` |
# | `source-options.trim` | `trim-source` |
# | `source-options.strip-color-codes` | `strip-color-codes`, `ignore-color-codes` |
# | `source-options.count-whitespace` | `count-whitespace` |
# | `source-options.max-characters` | `max-source-characters` |
# | `result.type` | `output-mode` |
# | `result.value` | `value`, `output-value`, `space-character` |
# | `result.template` | `template`, `output-template` |
# | `result.max-length` | `max-output-length` |
#
# Hem standart hem düz anahtar yazılırsa standart iç içe anahtar önceliklidir.
# Normal metin için Unicode kaçışı gerekmez. Örneğin üst seviyedeki `value: "-"`
# tireleri, `value: "ABC"` ise ABC biriminin tamamını tekrarlar. Önerilen iç içe
# yazım yine `result.value` biçimidir.
#
# ### Çıktı örnekleri
#
# Sayı döndürme:
#
# ```yaml
# ad_sayisi:
#   type: "adaptive"
#   source: "%player_name%"
#   calculation: { mode: "direct", ratio: 1, base: 0, minimum: 0, maximum: 64 }
#   result: { type: "number" }
# ```
#
# Gereken sayıda boşluk döndürme:
#
# ```yaml
# ad_boslugu:
#   type: "adaptive"
#   source: "%player_name%"
#   calculation: { mode: "reverse", ratio: 1, base: 20, minimum: 1, maximum: 20 }
#   result: { type: "repeat", value: " " }
# ```
#
# Sembol veya emoji tekrarlama:
#
# ```yaml
# ad_noktalari:
#   type: "adaptive"
#   source: "%player_name%"
#   calculation: { mode: "direct", ratio: 0.5, base: 0, minimum: 0, maximum: 32, rounding: "ceiling" }
#   result: { type: "repeat", value: "•" }
# ```
#
# Özel metin oluşturma:
#
# ```yaml
# ad_raporu:
#   type: "adaptive"
#   source: "%player_name%"
#   calculation: { mode: "reverse", ratio: 1, base: 24, minimum: 0, maximum: 24 }
#   result:
#     type: "template"
#     value: "•"
#     template: "Oyuncu={source}, karakter={length}, hesaplanan={count}, sembol={value}"
# ```
#
# Ölçülen kaynak aralığını negatif/pozitif sonuç aralığına eşleme:
#
# ```yaml
# map_ad_puani:
#   type: "adaptive"
#   source: "%player_name%"
#   calculation:
#     mode: "map"
#     source-minimum: 0
#     source-maximum: 20
#     minimum: -100
#     maximum: 100
#     rounding: "nearest"
#   result: { type: "number" }
# ```
#
# ### Adaptive sonuçlar neden literaldir?
#
# Her adaptive kaynak öğesi yenileme başına bir kez ayrıştırılır. Üretilen sonuç tekrar PlaceholderAPI'ye verilmez. Bu nedenle `%`, `%player_name%` veya yüzde içeren başka bir değer tekrarlandığında literal kalır. Yanlışlıkla recursive expansion ve işlem yükü katlanması engellenir. Çözülmüş ve birleştirilmiş kaynak sonuçta gösterilecekse template modundaki `{source}` kullanılmalıdır.
#
# ## 12. İç İçe Placeholder ve Güvenlik Davranışı
#
# - Döngüsel `%split_*%` referansları thread bazında algılanır.
# - Tekrar eden anahtar sonsuz recursion yerine görünür bir loop işareti döndürür.
# - Çözümleme derinliği 32 farklı Split anahtarıyla sınırlıdır.
# - 128 UTF-16 biriminden uzun Split placeholder parametreleri reddedilir.
# - Runtime çözümleme hataları güvenli biçimde boş değere düşer; ayrıntılı stack trace yalnızca debug açıkken loglanır.
# - Yapılandırma reload'u atomik bellek geçişi kullanır. İstekler ya önceki tam yapılandırmayı ya yeni tam yapılandırmayı görür.
# - Folia'ya özel sınıflar runtime köprüsünün arkasında yalıtılır; tek JAR ile Spigot/Paper uyumluluğu korunur.
# - Folia üzerinde klasik Bukkit scheduler çağrısı yapılmaz; entity, global-region ve async sahiplik kurallarına uyulur.
# - Adaptive sınırlar kaynak öğelerini, cache boyutunu, sayımı ve üretilen çıktı yükünü kontrol altında tutar.
#
# ## 13. Sorun Giderme
#
# ### `%split_anahtar%` değişmeden görünüyor
#
# - PlaceholderAPI'nin kurulu ve etkin olduğunu doğrulayın.
# - Anahtarın `placeholders.yml` içinde üst seviyede bulunduğunu doğrulayın.
# - `/papi list` ile Split expansion'ın kayıtlı olduğunu kontrol edin.
# - `/split reload` çalıştırıp konsoldaki YAML/doğrulama hatalarını inceleyin.
#
# ### Her oyuncu Java değerini alıyor
#
# - Floodgate'in kurulu ve etkin olduğunu doğrulayın.
# - Sorgulanan oyuncunun çevrimiçi olduğunu doğrulayın.
# - Split'in doğrulanamayan oyuncuları `default-to-java-on-null` ayarına göre işlediğini unutmayın.
#
# ### Adaptive sayı beklenenden büyük
#
# - `source-options.strip-color-codes` ayarını açın.
# - Noktalama ve boşlukların sayılıp sayılmayacağına karar verin.
# - Boşluklar yok sayılacaksa `source-options.count-whitespace: false` kullanın.
# - Hesabı görmek için geçici olarak template modunda `template: "source={source}, length={length}, count={count}"` kullanın.
#
# ### Reload başarısız
#
# - YAML girintilerinde tab değil boşluk kullanın.
# - YAML için özel anlam taşıyan noktalama içeren değerleri tırnak içine alın.
# - Adaptive aralıklarını ve limitlerini kontrol edin.
# - Konsoldaki exception'ı inceleyin. Eski geçerli yapılandırma aktif kalır.
#
# ### `wiki.yml` değişiklikleri kayboluyor
#
# Bu beklenen davranıştır. `wiki.yml` otomatik üretilen dokümantasyondur, kullanıcı ayar dosyası değildir. İşlevsel değişiklikleri üç YAML dosyasında yapın. Kişisel notlarınızı farklı adlandırılmış bir dosyada tutun.
