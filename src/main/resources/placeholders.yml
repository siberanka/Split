# ==============================================================================
# Split - Placeholders Configuration / Wiki & Guide
# ==============================================================================
#
# [ENGLISH WIKI]
# This file defines dynamic placeholders resolving under %split_<key>%.
# Four placeholder types are supported:
#
# 1. simple:
#    Resolves different values depending on the player platform (Java or Bedrock).
#    Example:
#    example_key:
#      type: "simple"
#      java: "Java Player"
#      bedrock: "Bedrock Player"
#
# 2. switch:
#    Resolves a target string (usually another placeholder) and matches it
#    against configured cases. Falls back to "default" if no case matches.
#    Example:
#    example_key:
#      type: "switch"
#      switch: "%luckperms_highest_group_by_weight%"
#      case:
#        "admin": "Administrator"
#        default: "Regular Player"
#
# 3. expression:
#    Evaluates a boolean/mathematical expression and returns "true" or "false" value.
#    Supports: >, <, >=, <=, ==, !=, &&, ||, AND, OR.
#    Alternative operators like >> (greater than) and << (less than) are also supported.
#    Example:
#    example_key:
#      type: "expression"
#      formule: "%player_ping% >> 60 && %player_ping% << 120"
#      true: "Stable Ping"
#      false: "Unstable Ping"
#
# 4. adaptive:
#    Counts Unicode characters in a resolved source and calculates a bounded value.
#    DIRECT: base + (length * ratio), INVERSE: base - (length * ratio).
#    The result can repeat any text, return the number, or render a template.
#    See the working example at the end of this file.
#
# ------------------------------------------------------------------------------
#
# [TÜRKÇE VİKİ]
# Bu dosya %split_<anahtar>% altında çözümlenecek dinamik placeholder'ları tanımlar.
# Dört farklı tip desteklenmektedir:
#
# 1. simple:
#    Oyuncu platformuna göre (Java veya Bedrock) farklı çıktılar döndürür.
#    Örnek:
#    example_key:
#      type: "simple"
#      java: "Java Oyuncusu"
#      bedrock: "Bedrock Oyuncusu"
#
# 2. switch:
#    Hedeflenen bir metni (genellikle başka bir placeholder) çözümler ve tanımlı
#    durumlarla eşleştirir. Eşleşme olmazsa "default" değerini döndürür.
#    Örnek:
#    example_key:
#      type: "switch"
#      switch: "%luckperms_highest_group_by_weight%"
#      case:
#        "admin": "Yönetici"
#        default: "Normal Oyuncu"
#
# 3. expression:
#    Matematiksel/mantıksal bir koşulu çözümler ve "true" ya da "false" değerini döndürür.
#    Desteklenenler: >, <, >=, <=, ==, !=, &&, ||, AND, OR.
#    Alternatif olarak >> (büyüktür) ve << (küçüktür) işlemleri de kullanılabilir.
#    Örnek:
#    example_key:
#      type: "expression"
#      formule: "%player_ping% >> 60 && %player_ping% << 120"
#      true: "Stabil Ping"
#      false: "Stabil Olmayan Ping"
#
# 4. adaptive:
#    Çözümlenmiş kaynağın Unicode karakterlerini sayar ve sınırlı bir değer hesaplar.
#    DIRECT: taban + (uzunluk * oran), INVERSE: taban - (uzunluk * oran).
#    Sonuç; istenen metni tekrarlayabilir, sayı döndürebilir veya şablon üretebilir.
#    Dosyanın sonundaki çalışan örneğe bakın.
#
# ==============================================================================

example:
  type: "simple"
  java: "Java"
  bedrock: "Bedrock"

example_switch:
  type: "switch"
  switch: "%luckperms_highest_group_by_weight%"
  case:
    "coal": "Coal"
    default: "Player"

example_expression:
  type: "expression"
  formule: "%player_ping% >> 60 && %player_ping% << 120"
  true: "Ping is stable"
  false: "Ping is not stable"

# %split_adaptive_spacing%
# A 32-space area shrinks by one space for every resolved source character.
# Each list entry is refreshed after the per-player cooldown; requests inside the
# cooldown receive the last calculated value normally, without a status message.
adaptive_spacing:
  type: "adaptive"
  source:
    - "%vault_eco_balance_formatted%"
    - "%superior_island_level_format%"
  calculation:
    mode: "inverse"       # direct | inverse
    ratio: 1.0
    base: 32
    minimum: 2
    maximum: 32
    rounding: "nearest"   # floor | ceiling | nearest
  source-options:
    separator: ""                 # Literal text counted between list entries
    cooldown-milliseconds: 250    # Range: 100..60000; default: 250
    max-cache-entries: 1024       # UUID entries, per adaptive key; max: 4096
    trim: false
    strip-color-codes: true
    count-whitespace: true
    max-characters: 8192
  result:
    type: "repeat"        # repeat | number | template
    value: " "
    template: "{count}"  # Used only when type is template
    max-length: 8192
