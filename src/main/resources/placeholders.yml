# ==============================================================================
# Split - Placeholders Configuration / Wiki & Guide
# ==============================================================================
#
# [ENGLISH WIKI]
# This file defines dynamic placeholders resolving under %split_<key>%.
# Five placeholder types are supported:
#
# 1. simple:
#    Resolves different values depending on the player platform (Java or Bedrock).
#    Example:
#    example_key:
#      type: "simple"
#      java: "Java Player"
#      bedrock: "Bedrock Player"
#
# 2. switch:
#    Resolves a target string (usually another placeholder) and matches it
#    against configured cases. Falls back to "default" if no case matches.
#    Example:
#    example_key:
#      type: "switch"
#      switch: "%luckperms_highest_group_by_weight%"
#      case:
#        "admin": "Administrator"
#        default: "Regular Player"
#
# 3. expression:
#    Evaluates a boolean/mathematical expression and returns "true" or "false" value.
#    Supports: >, <, >=, <=, ==, !=, &&, ||, AND, OR.
#    Alternative operators like >> (greater than) and << (less than) are also supported.
#    Example:
#    example_key:
#      type: "expression"
#      formule: "%player_ping% >> 60 && %player_ping% << 120"
#      true: "Stable Ping"
#      false: "Unstable Ping"
#
# 4. parse:
#    Resolves `parse` with the requesting player, finds that exact online or known
#    offline player, then resolves Java/Bedrock using the target as context.
#    Unknown targets return empty and lookup attempts are strictly bounded.
#    Example:
#    example_target:
#      type: "parse"
#      parse: "%example_player%"
#      java: "%example_java%"
#      bedrock: "%example_bedrock%"
#
# 5. adaptive:
#    Counts Unicode characters in a resolved source and calculates a bounded value.
#    DIRECT: base + (length * ratio), REVERSE: base - (length * ratio).
#    MAP: linearly maps source-minimum..source-maximum to minimum..maximum.
#    MAP endpoints may descend, for example minimum: 100 and maximum: -100.
#    Numeric/template output may be negative; repeat is empty at zero or below.
#    The result can repeat any text, return the number, or render a template.
#    See the working example at the end of this file.
#
# ------------------------------------------------------------------------------
#
# [TÜRKÇE VİKİ]
# Bu dosya %split_<anahtar>% altında çözümlenecek dinamik placeholder'ları tanımlar.
# Beş farklı tip desteklenmektedir:
#
# 1. simple:
#    Oyuncu platformuna göre (Java veya Bedrock) farklı çıktılar döndürür.
#    Örnek:
#    example_key:
#      type: "simple"
#      java: "Java Oyuncusu"
#      bedrock: "Bedrock Oyuncusu"
#
# 2. switch:
#    Hedeflenen bir metni (genellikle başka bir placeholder) çözümler ve tanımlı
#    durumlarla eşleştirir. Eşleşme olmazsa "default" değerini döndürür.
#    Örnek:
#    example_key:
#      type: "switch"
#      switch: "%luckperms_highest_group_by_weight%"
#      case:
#        "admin": "Yönetici"
#        default: "Normal Oyuncu"
#
# 3. expression:
#    Matematiksel/mantıksal bir koşulu çözümler ve "true" ya da "false" değerini döndürür.
#    Desteklenenler: >, <, >=, <=, ==, !=, &&, ||, AND, OR.
#    Alternatif olarak >> (büyüktür) ve << (küçüktür) işlemleri de kullanılabilir.
#    Örnek:
#    example_key:
#      type: "expression"
#      formule: "%player_ping% >> 60 && %player_ping% << 120"
#      true: "Stabil Ping"
#      false: "Stabil Olmayan Ping"
#
# 4. parse:
#    `parse` alanını isteyen oyuncuyla çözümler, tam eşleşen çevrimiçi veya bilinen
#    çevrimdışı oyuncuyu bulur ve Java/Bedrock değerini hedef bağlamında çözümler.
#    Bilinmeyen hedef boş döner ve arama denemeleri kesin olarak sınırlıdır.
#    Örnek:
#    example_target:
#      type: "parse"
#      parse: "%example_player%"
#      java: "%example_java%"
#      bedrock: "%example_bedrock%"
#
# 5. adaptive:
#    Çözümlenmiş kaynağın Unicode karakterlerini sayar ve sınırlı bir değer hesaplar.
#    DIRECT: taban + (uzunluk * oran), REVERSE: taban - (uzunluk * oran).
#    MAP: source-minimum..source-maximum aralığını minimum..maximum aralığına eşler.
#    MAP uçları azalabilir; örneğin minimum: 100 ve maximum: -100 geçerlidir.
#    Sayı/template negatif olabilir; repeat sıfır veya altında boş döner.
#    Sonuç; istenen metni tekrarlayabilir, sayı döndürebilir veya şablon üretebilir.
#    Dosyanın sonundaki çalışan örneğe bakın.
#
# ==============================================================================

example:
  type: "simple"
  java: "Java"
  bedrock: "Bedrock"

example_switch:
  type: "switch"
  switch: "%luckperms_highest_group_by_weight%"
  case:
    "coal": "Coal"
    default: "Player"

example_expression:
  type: "expression"
  formule: "%player_ping% >> 60 && %player_ping% << 120"
  true: "Ping is stable"
  false: "Ping is not stable"

example_target:
  type: "parse"
  parse: "%example_player%"
  java: "%example_java%"
  bedrock: "%example_bedrock%"
  parse-options:
    allow-offline: true          # Default true / Varsayılan true
    cooldown-milliseconds: 250  # Safe range / Güvenli aralık: 100..60000
    max-cache-entries: 1024     # Safe range / Güvenli aralık: 1..4096
    max-output-length: 4096     # Safe range / Güvenli aralık: 1..16384

# %split_adaptive_spacing%
# A 32-space area shrinks by one space for every resolved source character.
# Each list entry is refreshed after the per-player cooldown; requests inside the
# cooldown receive the last calculated value normally, without a status message.
adaptive_spacing:
  type: "adaptive"
  source:
    - "%vault_eco_balance_formatted%"
    - "%superior_island_level_format%"
  calculation:
    mode: "reverse"       # direct | reverse | map (inverse = reverse alias)
    ratio: 1.0
    base: 32
    minimum: 2
    maximum: 32
    rounding: "nearest"   # floor | ceiling | nearest
  source-options:
    separator: ""                 # Literal text counted between list entries
    cooldown-milliseconds: 250    # Range: 100..60000; default: 250
    max-cache-entries: 1024       # UUID entries, per adaptive key; max: 4096
    trim: false
    strip-color-codes: true
    count-whitespace: true
    max-characters: 8192
  result:
    type: "repeat"        # repeat | number | template
    value: " "
    template: "{count}"  # Used only when type is template
    max-length: 8192

# MAP example / MAP örneği:
# %split_adaptive_mapped_number% maps 0..20 measured characters to 100..-100.
# In MAP mode, minimum and maximum are endpoints and may descend numerically.
# MAP modunda minimum ve maximum uç değerlerdir; sayısal olarak azalabilirler.
adaptive_mapped_number:
  type: "adaptive"
  source: "%player_name%"
  calculation:
    mode: "map"
    source-minimum: 0
    source-maximum: 20
    minimum: 100
    maximum: -100
    rounding: "nearest"
  result:
    type: "number"
